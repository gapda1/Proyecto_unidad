{% extends "base.html" %}


{% block title %}
Perfil
{% endblock %}


{% block content %}

<h1>Perfil del usuario</h1>


<div class="perfil">

    <p>
        <strong>ID:</strong>
        {{ usuario.id }}
    </p>

    <p>
        <strong>Usuario:</strong>
        {{ usuario.username|capitalize }}
    </p>

    <p>
        <strong>Correo:</strong>
        {{ usuario.email }}
    </p>

</div>


<a
    class="boton"
    href="{{ url_for(
        'users.edit_profile',
        id=usuario.id
    ) }}"
>
    Editar perfil
</a>


<form
    class="form-eliminar"
    action="{{ url_for(
        'users.delete_profile',
        id=usuario.id
    ) }}"
    method="POST"
>

    <input
        type="hidden"
        name="csrf_token"
        value="{{ csrf_token() }}"
    >

    <button
        type="submit"
        onclick="return confirmarEliminacion()"
    >
        Eliminar usuario
    </button>

</form>

{% endblock %}
