<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        Sistema de usuarios
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    {% block nav %}

    <nav>
        <a href="{{ url_for('users.index') }}">
            Inicio
        </a>

        <a href="{{ url_for('users.register') }}">
            Registro
        </a>

        <a href="{{ url_for('users.login') }}">
            Login
        </a>

        {% if session.get('user_id') %}

        <a href="{{ url_for('users.logout') }}">
            Cerrar sesión
        </a>

        {% endif %}
    </nav>

    {% endblock %}


    {% include "_messages.html" %}


    <main>
        {% block content %}
        {% endblock %}
    </main>


    <script
        src="{{ url_for('static', filename='js/script.js') }}">
    </script>

</body>

</html>
